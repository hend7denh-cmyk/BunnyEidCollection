<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>كتالوج bunny for kids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: control bar (products / store settings / preview) above the work area.
   The preview and the downloaded file use the same viewer code, so what you see is what you ship. */
:root{
  color-scheme:light;
  --bg:#eef1f4; --sf:#ffffff; --fg:#1f2a30; --mut:#5a6870; --ln:#d9e0e5; --fd:#f6f8fa;
  --a:#b5443b; --a-soft:#fbe9e7; --ok:#1f7a4d; --danger:#b42318;
  --font:"Cairo","Tajawal",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.aw{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{background:var(--sf);border-bottom:1px solid var(--ln);padding-block:12px}
.bar .aw{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600}
.tab[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff}
.sp{flex:1 1 auto}
.status{font-size:.82rem;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--sf);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:default}
[hidden]{display:none!important}
#ed{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.hint{background:#fff8e6;border:1px solid #f0dca0;border-radius:8px;padding:10px 14px;font-size:.9rem}
.count{font-size:.9rem;color:var(--mut)}
.count .miss{color:#9a4a07;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.pimg{aspect-ratio:3/4;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--fd);overflow:hidden;max-width:100%}
.pimg img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pph{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-align:center;padding:12px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.pph svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pbar{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;text-align:center;padding:5px}
.sold{position:absolute;top:10px;right:10px;background:var(--danger);color:#fff;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px}
.pb{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.in{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--ln);background:var(--fd);border-radius:8px}
.in.empty{border-style:dashed;border-color:var(--a)}
textarea.in{resize:vertical;min-height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr{display:flex;gap:6px;align-items:center;min-width:0}
.pr .cur{font-size:.8rem;color:var(--mut);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:2px 10px;font-size:.8rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--a-soft);border-color:var(--a);color:var(--a);font-weight:700}
.chips .in{width:auto;flex:1 1 120px;padding:3px 10px;font-size:.8rem;border-radius:999px}
details.more{border-top:1px solid var(--ln);padding-top:8px}
details.more summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--mut)}
details.more .stack{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.lbl{font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl label{font-size:.85rem;display:flex;gap:5px;align-items:center;cursor:pointer}
.drop{border:2px dashed var(--ln);border-radius:12px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;cursor:pointer;color:var(--mut)}
.drop:hover,.drop.over{border-color:var(--a);color:var(--a)}
.drop b{font-size:1.05rem}
.sec{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:1.05rem}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.in[type="color"]{padding:2px;height:40px;cursor:pointer}
.logorow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logorow img{width:140px;max-width:100%;height:auto;border:1px solid var(--ln);border-radius:12px;background:#fff;padding:6px}
.logofb{border:1px dashed var(--ln);border-radius:12px;padding:14px 20px;font-weight:900;font-size:1.3rem}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:440px;background:var(--fg);color:#fff;padding:10px 16px;border-radius:8px;font-size:.9rem;text-align:center;z-index:80;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#view[hidden]{display:none!important}
</style>

<div id="app" dir="rtl" lang="ar">
  <div class="bar" id="bar">
    <div class="aw">
      <div class="tabs" role="tablist">
        <button class="tab" type="button" data-tab="products">المنتجات</button>
        <button class="tab" type="button" data-tab="settings">إعدادات المتجر</button>
        <button class="tab" type="button" data-tab="preview">معاينة الكتالوج</button>
      </div>
      <span class="sp"></span>
      <span class="status" id="status" aria-live="polite"></span>
      <button class="btn pri" id="b-export" type="button" hidden>تنزيل الكتالوج</button>
      <button class="btn" id="b-backup" type="button" hidden>نسخة احتياطية</button>
      <label class="btn" for="file-import">استيراد نسخة</label>
    </div>
  </div>

  <div id="ed" class="aw">
    <div id="p-products">
      <div class="row" style="margin-bottom:12px">
        <button class="btn pri" id="b-add" type="button">+ إضافة منتج</button>
        <label class="btn" for="file-multi">رفع صور متعددة</label>
        <span class="count" id="count"></span>
      </div>
      <div class="hint" id="tip" style="margin-bottom:14px">أسرع طريقة: اضغط «رفع صور متعددة» واختر كل صور المنتجات، فتتحول كل صورة إلى بطاقة. بعدها اكتب الاسم والسعر على كل بطاقة.</div>
      <div class="pgrid" id="pgrid"></div>
    </div>
    <div id="p-settings" hidden></div>
  </div>

  <div id="view" class="cv" hidden></div>

  <input type="file" id="file-multi" class="sr" accept="image/*" multiple>
  <input type="file" id="file-one" class="sr" accept="image/*">
  <input type="file" id="file-logo" class="sr" accept="image/*">
  <input type="file" id="file-import" class="sr" accept=".json,application/json">
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
/* ===== The viewer: used by the preview and written into the downloaded file. Self-contained on purpose. ===== */
function catalogViewer(D, root){
  var S = D.s, items = D.items;
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var P = {
    heart:'<path d="M12 20.5s-7.5-4.6-9.5-9.2A5.2 5.2 0 0 1 12 6.6a5.2 5.2 0 0 1 9.5 4.7c-2 4.6-9.5 9.2-9.5 9.2z"/>',
    check:'<polyline points="5 12.5 10 17.5 19 7.5"/>',
    crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',
    truck:'<path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
    tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
    gem:'<path d="M6 4h12l4 6-10 11L2 10z"/><path d="M2 10h20M9 4l3 17M15 4l-3 17"/>',
    chat:'<path d="M4 20l1.4-4.2A8 8 0 1 1 8.2 18.6z"/><path d="M9 9.5c.5 2.5 2.5 4.5 5 5l1.2-1.3-2-1-.9.7a4 4 0 0 1-1.8-1.8l.7-.9-1-2z"/>',
    pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    arrow:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
    shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><polyline points="8.5 12 11 14.5 15.5 9.5"/>',
    note:'<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>'
  };
  var ic = function(n, c){ return '<svg class="ic ' + (c || "") + '" viewBox="0 0 24 24" aria-hidden="true">' + P[n] + '</svg>'; };
  var cur = S.currency || "";
  var fmt = function(p){
    var t = String(p == null ? "" : p).trim(); if (!t) return "";
    if (/^[\d.,\s]+$/.test(t)) { var n = Number(t.replace(/[,\s]/g, "")); if (isFinite(n)) return n.toLocaleString("en-US", {maximumFractionDigits: 2}); }
    return t;
  };
  var num = function(p){ var n = Number(String(p).replace(/[,\s]/g, "")); return isFinite(n) && String(p).trim() !== "" ? n : null; };
  var wa = "https://wa.me/" + String(S.whatsapp || "").replace(/\D/g, "");
  var sizes = String(S.sizes || "").split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
  var brand = ((S.logoTextA || "") + " " + (S.logoTextB || "")).trim();

  var tags = [];
  items.forEach(function(it){ (it.cats || []).forEach(function(t){ if (t && tags.indexOf(t) < 0) tags.push(t); }); });
  var filter = "all", sort = "default", active = null, size = sizes[0] || "";

  root.setAttribute("dir", "rtl"); root.setAttribute("lang", "ar");
  root.style.setProperty("--c1", S.c1 || "#F28B82"); root.style.setProperty("--c2", S.c2 || "#5BB5E5");

  var prices = items.map(function(it){ return num(it.price); }).filter(function(n){ return n !== null; });
  var lo = prices.length ? Math.min.apply(null, prices) : null, hi = prices.length ? Math.max.apply(null, prices) : null;
  var range = "";
  if (lo !== null) {
    range = '<div class="rng"><span class="rico">' + ic("tag") + '</span><div><div class="rl">نطاق أسعار التشكيلة</div><div class="rv">' +
      (lo === hi ? 'السعر <b class="c1">' + esc(fmt(lo)) + ' ' + esc(cur) + '</b>' :
        'تبدأ من <b class="c1">' + esc(fmt(lo)) + ' ' + esc(cur) + '</b> إلى <b class="c2">' + esc(fmt(hi)) + ' ' + esc(cur) + '</b>') +
      '</div></div></div>';
  }
  var logo = S.logo
    ? '<img src="' + S.logo + '" alt="' + esc(brand) + '">'
    : '<div class="lt"><span class="c1">' + esc(S.logoTextA) + '</span> <span class="c2">' + esc(S.logoTextB) + '</span></div><div class="ls">' + esc(S.storeAr) + '</div>';

  var shell =
    '<div class="top"><div class="w"><span>' + ic("crown") + ' ' + esc(S.topBar1) + '</span>' +
      (S.topBar2 ? '<span class="sep">|</span><span>' + ic("truck") + ' ' + esc(S.topBar2) + '</span>' : '') + '</div></div>' +
    '<header class="hd"><div class="w">' +
      '<div class="logo">' + logo + '</div>' +
      '<div class="pill"><span class="ck">' + ic("check") + '</span><span>' + esc(S.badgeText) + '</span>' + ic("heart", "c1") + '</div>' +
      '<h1>' + esc(S.titleStart) + ' <span class="c1">' + esc(S.titleAccent) + '</span> ' + esc(S.titleEnd) + '</h1>' +
      '<p class="intro">' + esc(S.intro) + '</p>' + range +
    '</div></header>' +
    '<section class="fb"><div class="w fbi"><div class="fl" data-r="filters"></div>' +
      '<label class="so"><span>ترتيب حسب:</span><select data-r="sort"><option value="default">التشكيلة المميزة</option><option value="asc">السعر: من الأقل</option><option value="desc">السعر: من الأعلى</option></select></label>' +
    '</div></section>' +
    '<main class="w"><div class="grid" data-r="grid"></div></main>' +
    '<section class="w feat"><div class="fbox">' +
      [["gem", "f1t", "f1d"], ["truck", "f2t", "f2d"], ["chat", "f3t", "f3d"]].map(function(f){
        return '<div class="fi"><div class="fic">' + ic(f[0]) + '</div><h3>' + esc(S[f[1]]) + '</h3><p>' + esc(S[f[2]]) + '</p></div>';
      }).join("") + '</div></section>' +
    '<footer class="ft"><div class="w fti"><div><div class="fbn"><span class="c1">' + esc(S.logoTextA) + '</span> <span class="c2">' + esc(S.logoTextB) + '</span> <small>| ' + esc(S.storeAr) + '</small></div>' +
      '<p class="fad">' + ic("pin", "c1") + ' ' + esc(S.address) + '</p></div>' +
      '<div class="fl2">' +
        (S.whatsapp ? '<a class="sb wa" href="' + wa + '" target="_blank" rel="noopener noreferrer">' + ic("chat") + '<span dir="ltr">' + esc(S.whatsappLabel || S.whatsapp) + '</span></a>' : '') +
        (S.tiktok ? '<a class="sb tk" href="https://www.tiktok.com/@' + esc(String(S.tiktok).replace(/^@/, "")) + '" target="_blank" rel="noopener noreferrer">' + ic("note") + '<span dir="ltr">@' + esc(String(S.tiktok).replace(/^@/, "")) + '</span></a>' : '') +
      '</div></div><div class="w cp">' + esc(S.copyright) + '</div></footer>' +
    (S.whatsapp ? '<a class="float" href="' + wa + '" target="_blank" rel="noopener noreferrer">' + ic("chat") + '<span>تواصلي معنا</span></a>' : '') +
    '<div class="md" data-r="modal"><div class="mb" role="dialog" aria-modal="true">' +
      '<button class="mx" type="button" data-a="close" aria-label="إغلاق">' + ic("x") + '</button>' +
      '<div class="mg"><div class="mi"><img data-r="mimg" alt=""><span class="mbadge" data-r="mbadge"></span></div>' +
      '<div class="mt"><div><div class="mcat" data-r="mcat"></div><h2 data-r="mtitle"></h2>' +
        '<div class="mp"><span data-r="mprice"></span></div><p class="mdesc" data-r="mdesc"></p>' +
        '<div data-r="mfw"><h4>تفاصيل الخامة والتصميم:</h4><ul data-r="mfeat"></ul></div>' +
        '<div class="msz" data-r="msz"><div class="mszh"><label>اختاري المقاس (العمر):</label><span data-r="mszv"></span></div><div class="szg" data-r="szg"></div></div></div>' +
        '<div class="mact"><a class="ob" data-r="order" href="#" target="_blank" rel="noopener noreferrer">' + ic("chat") + '<span>' + esc(S.orderBtn) + '</span></a>' +
        (S.payNote ? '<p>' + ic("shield", "c2") + ' ' + esc(S.payNote) + '</p>' : '') + '</div></div></div></div></div>';
  root.innerHTML = shell;
  var R = function(n){ return root.querySelector('[data-r="' + n + '"]'); };

  function renderFilters(){
    var all = [["all", "الكل (" + items.length + ")"]].concat(tags.map(function(t){ return [t, t]; }));
    R("filters").innerHTML = all.map(function(f){
      return '<button type="button" class="fbtn' + (f[0] === filter ? " on" : "") + '" data-a="filter" data-v="' + esc(f[0]) + '">' + esc(f[1]) + '</button>';
    }).join("");
  }
  function card(it){
    var img = it.image
      ? '<img class="im" src="' + it.image + '" alt="' + esc(it.name) + '" loading="lazy">'
      : '<div class="ph"' + (it.grad ? ' style="background:' + esc(it.grad) + '"' : "") + '>' + ic("crown") + '<b>' + esc(it.name) + '</b></div>';
    var p = fmt(it.price);
    return '<article class="card' + (it.soldOut ? " out" : "") + '"><div>' +
      '<div class="cimg" data-a="open" data-v="' + it.id + '">' + img +
        (it.badge ? '<span class="cb">' + esc(it.badge) + '</span>' : '') +
        (it.code ? '<span class="cc">' + esc(it.code) + '</span>' : '') +
        (it.soldOut ? '<span class="so2">نفدت الكمية</span>' : '') + '</div>' +
      '<div class="cbody">' + (it.label ? '<span class="lab">' + esc(it.label) + '</span>' : '') +
        '<h2 data-a="open" data-v="' + it.id + '">' + esc(it.name) + '</h2>' +
        (it.short ? '<p>' + esc(it.short) + '</p>' : '') + '</div></div>' +
      '<div class="cf"><div>' + (p ? '<span class="pl">السعر</span><span class="pv">' + esc(p) + ' <small>' + esc(cur) + '</small></span>' : '') + '</div>' +
      '<button type="button" class="mb2" data-a="open" data-v="' + it.id + '"><span>التفاصيل والطلب</span>' + ic("arrow") + '</button></div></article>';
  }
  function renderGrid(){
    var list = items.filter(function(it){ return filter === "all" || (it.cats || []).indexOf(filter) > -1; });
    var val = function(it){ var n = num(it.price); return n === null ? Infinity : n; };
    if (sort === "asc") list = list.slice().sort(function(a, b){ return val(a) - val(b); });
    if (sort === "desc") list = list.slice().sort(function(a, b){ return (num(b.price) || 0) - (num(a.price) || 0); });
    R("grid").innerHTML = list.map(card).join("") || '<div class="none">لا توجد منتجات في هذا التصنيف.</div>';
  }
  function order(){
    if (!active) return;
    var p = fmt(active.price);
    var m = "السلام عليكم متجر " + brand + " 🌸\nأرغب بطلب المنتج التالي من الكتالوج:\n\n👗 *الموديل:* " + active.name +
      (active.code ? "\n🏷️ *الكود:* " + active.code : "") + (size ? "\n📏 *المقاس المطلوب:* " + size : "") +
      (p ? "\n💰 *السعر:* " + p + " " + cur : "") + "\n\nيرجى تأكيد التوفر وتفاصيل التوصيل.";
    R("order").href = wa + "?text=" + encodeURIComponent(m);
  }
  function renderSizes(){
    R("mszv").textContent = size;
    R("szg").innerHTML = sizes.map(function(s){
      return '<button type="button" class="sz' + (s === size ? " on" : "") + '" data-a="size" data-v="' + esc(s) + '">' + esc(s) + '</button>';
    }).join("");
    order();
  }
  function openModal(id){
    active = items.filter(function(x){ return String(x.id) === String(id); })[0]; if (!active) return;
    var im = R("mimg");
    if (active.image) { im.src = active.image; im.style.display = ""; } else { im.removeAttribute("src"); im.style.display = "none"; }
    im.alt = active.name;
    var bx = R("mbadge"); bx.textContent = active.badge || ""; bx.style.display = active.badge ? "" : "none";
    R("mcat").textContent = [active.label, active.code ? "كود " + active.code : ""].filter(Boolean).join(" • ");
    R("mtitle").textContent = active.name;
    R("mprice").textContent = fmt(active.price) ? fmt(active.price) + " " + cur : "";
    var d = R("mdesc"); d.textContent = active.full || active.short || ""; d.style.display = d.textContent ? "" : "none";
    var fs = String(active.features || "").split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    R("mfw").style.display = fs.length ? "" : "none";
    R("mfeat").innerHTML = fs.map(function(f){ return '<li>' + ic("check", "c2") + '<span>' + esc(f) + '</span></li>'; }).join("");
    R("msz").style.display = sizes.length ? "" : "none";
    renderSizes();
    var o = R("order"); o.style.pointerEvents = active.soldOut ? "none" : ""; o.style.opacity = active.soldOut ? ".5" : "";

    return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(title) +
      '</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"><style>body{margin:0}' + VIEW_CSS +
      '</style></head><body><div id="root" class="cv"></div><script>var D=' + data + ';(' + catalogViewer.toString() + ')(D,document.getElementById("root"));<' + '/script></body></html>';
  }
  function saveFile(name, data){
    if (!dl) { toast("التنزيل غير متاح في هذا العرض."); return; }
    dl.save({filename: name, data: data}).then(function(r){ if (r && r.status === "saved") toast("تم حفظ الملف."); })
      .catch(function(e){ if (e && e.code === "declined") return; toast(e && e.code === "too_large" ? "الملف كبير جدًا. قلّل عدد الصور." : "تعذّر تنزيل الملف."); });
  }
  $("#b-export").addEventListener("click", function(){
    if (!D.items.length) { toast("أضف منتجًا واحدًا على الأقل."); return; }
    saveFile("catalog.html", buildExport());
  });
  $("#b-backup").addEventListener("click", function(){ saveFile("catalog-backup.json", JSON.stringify(D)); });
  $("#file-import").addEventListener("change", function(e){
    var f = e.target.files[0]; e.target.value = ""; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var d = JSON.parse(r.result);
        if (!d || !d.s || !Array.isArray(d.items)) throw new Error("bad");
        var base = seed(); D = {s: base.s, items: []};
        Object.keys(base.s).forEach(function(k){ if (typeof d.s[k] === "string") D.s[k] = d.s[k]; });
        D.items = d.items.map(function(x){
          return newItem({code: String(x.code || ""), name: String(x.name || ""), price: String(x.price || ""), label: String(x.label || ""), badge: String(x.badge || ""),
            grad: String(x.grad || ""), short: String(x.short || ""), full: String(x.full || ""), features: String(x.features || ""),
            cats: Array.isArray(x.cats) ? x.cats.map(String) : [], soldOut: !!x.soldOut, image: typeof x.image === "string" && /^data:image\//.test(x.image) ? x.image : ""});
        });
        setMode(mode); save(); toast("تم استيراد النسخة.");
      } catch (err) { toast("الملف غير صالح. اختر ملف نسخة احتياطية من هذه الأداة."); }
    };
    r.readAsText(f);
  });

  /* start */
  setMode("products");
  load().then(function(saved){
    if (saved && saved.s && Array.isArray(saved.items)) {
      var base = seed(); Object.keys(base.s).forEach(function(k){ if (saved.s[k] == null) saved.s[k] = base.s[k]; });
      D = saved; setMode(mode); setStatus("محفوظ في هذا المتصفح");
    }
  });
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function(d){ if (d) { dl = d; $("#b-export").hidden = false; $("#b-backup").hidden = false; } }).catch(function(){});
  }
})();
</script>

</body></html>
